name: Deploy web preview

# Builds the web version of the app and publishes it to Expo's free web hosting.
# The log ends with the URL. iPhone testers can open it in Safari and use Share > Add to Home Screen.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Public by design: the URL and publishable key are meant to ship inside the app.
      EXPO_PUBLIC_SUPABASE_URL: https://relxoomsdjghoqhukvlp.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_fYDudOcg-9H6lVgeBEa73g_LzOrb-p9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Link or create the Expo project
        run: eas init --non-interactive --force

      - name: Export web build
        run: npx expo export --platform web

      - name: Add the landing page at /landing
        run: |
          mkdir -p dist/landing
          cp landing/index.html dist/landing/index.html

      - name: Deploy to EAS Hosting
        run: eas deploy --prod --non-interactive
